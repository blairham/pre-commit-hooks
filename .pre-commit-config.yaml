# Pre-commit configuration for pre-commit-hooks
# Install: pre-commit install
# Run:     pre-commit run --all-files

repos:
  # General hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^build/
      - id: end-of-file-fixer
        exclude: ^build/
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: detect-private-key

  # Go formatting
  - repo: https://github.com/TekWizely/pre-commit-golang
    rev: v1.0.0-rc.4
    hooks:
      - id: go-mod-tidy-repo

  # Dogfood: this repo's own published hook checks this repo's own pin.
  # -mode=min because go.mod's directive here is a compatibility floor, not a pin.
  - repo: https://github.com/blairham/pre-commit-hooks
    rev: v0.1.0
    hooks:
      - id: check-go-version-sync
        args: [--mode=min]

  # golangci-lint at commit time, via the upstream hooks (no local scripts).
  # `golangci-lint-fmt` applies every formatter configured in .golangci.yml
  # (gofumpt AND goimports, which `go-fmt-repo` could not do);
  # `golangci-lint` lints only what changed since HEAD — the whole-repo,
  # enforced lint stays in CI, because --new-from-rev can't see whole-module
  # linters like `unused`.
  #
  # Unlike the other Go repos here, golangci-lint is deliberately NOT in a
  # go.mod `tool` block — this repo adds no dependencies (see AGENTS.md). Keep
  # this `rev` in lockstep with .tool-versions and the CI action instead.
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint-fmt
      # The diff-scoped hook (`--new-from-rev HEAD`), deliberately: this runs on
      # every commit and should report what you just wrote, not the
      # repository's whole backlog.
      #
      # Keep `rev` in lockstep with go.mod's tool pin.
      - id: golangci-lint

      # The same upstream hook, told which base to diff against and told not
      # to fix. Both flags are appended to the entry, and both override it
      # (measured):
      #
      #   `--new-from-merge-base` beats the entry's `--new-from-rev HEAD`,
      #   which on a clean checkout compares the tree against an identical
      #   HEAD and so finds nothing.
      #
      #   `--fix=false` beats the entry's `--fix`. This one is not a
      #   preference. Measured on a committed misspelling: with `--fix`,
      #   golangci-lint repaired the runner's working copy, printed
      #   `0 issues` and exited 0 — a green check, nothing reported, and the
      #   committed code still wrong. Fixing belongs to the hook above, which
      #   runs against your working tree where the repair is the point. CI
      #   only reports.
      #
      # `stages: [manual]` keeps it out of every local commit. CI asks for
      # this one by name.
      - id: golangci-lint
        alias: golangci-lint-new
        name: golangci-lint (issues this change introduces)
        stages: [manual]
        args: [--new-from-merge-base=origin/main, --fix=false]

  # Secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
