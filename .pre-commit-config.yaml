# Pre-commit configuration for pre-commit-hooks
# Install: pre-commit install
# Run:     pre-commit run --all-files

repos:
  # General hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^build/
      - id: end-of-file-fixer
        exclude: ^build/
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: detect-private-key

  # Go formatting
  - repo: https://github.com/TekWizely/pre-commit-golang
    rev: v1.0.0-rc.4
    hooks:
      - id: go-mod-tidy-repo

  # Dogfood: this repo's own published hook checks this repo's own pin.
  # -mode=min because go.mod's directive here is a compatibility floor, not a pin.
  - repo: https://github.com/blairham/pre-commit-hooks
    rev: v0.1.0
    hooks:
      - id: check-go-version-sync
        args: [--mode=min]

  # golangci-lint at commit time, via the upstream hooks (no local scripts).
  # `golangci-lint-fmt` applies every formatter configured in .golangci.yml
  # (gofumpt AND goimports, which `go-fmt-repo` could not do);
  # `golangci-lint` lints only what changed since HEAD — the whole-repo,
  # enforced lint stays in CI, because --new-from-rev can't see whole-module
  # linters like `unused`.
  #
  # Unlike the other Go repos here, golangci-lint is deliberately NOT in a
  # go.mod `tool` block — this repo adds no dependencies (see AGENTS.md). Keep
  # this `rev` in lockstep with .tool-versions and the CI action instead.
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint-fmt
      - id: golangci-lint

  # Secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
