# Pre-commit configuration for pre-commit-hooks
# Install: pre-commit install
# Run:     pre-commit run --all-files

repos:
  # General hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^build/
      - id: end-of-file-fixer
        exclude: ^build/
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: detect-private-key

  # Go formatting
  - repo: https://github.com/TekWizely/pre-commit-golang
    rev: v1.0.0-rc.4
    hooks:
      - id: go-mod-tidy-repo
      - id: go-fmt-repo

  # Dogfood: this repo's own hook checks this repo's own toolchain pin.
  - repo: local
    hooks:
      - id: check-go-version-sync
        name: check go version sync (go.mod ↔ .tool-versions)
        entry: go run ./cmd/check-go-version-sync -mode=min
        language: system
        files: '(^|/)go\.mod$|(^|/)\.tool-versions$'
        pass_filenames: false

  # Secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
