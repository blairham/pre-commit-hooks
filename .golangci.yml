# golangci-lint v2 configuration for pre-commit-hooks
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
  - errcheck
  - govet
  - ineffassign
  - staticcheck
  - unused
  - misspell
  - unconvert
  - gocritic
  - revive

  exclusions:
    rules:
    - path: _test\.go
      linters:
      - errcheck
      - gocritic
      - revive

  settings:
    misspell:
      locale: US
    errcheck:
      exclude-functions:
      - (*os.File).Close
      # Diagnostic writes to the command's own output writer. A failed write
      # to stdout/stderr has no recovery path — the only thing left to do
      # would be to report it the same way that just failed.
      - fmt.Fprint
      - fmt.Fprintf
      - fmt.Fprintln

formatters:
  enable:
  - gofmt
  - goimports

  settings:
    goimports:
      local-prefixes:
      - github.com/blairham/pre-commit-hooks

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
