- id: check-go-version-sync
  name: check go version sync (go.mod ↔ .tool-versions)
  description: |
    Fails when a go.mod `go` directive and the governing .tool-versions `golang`
    pin drift apart — they must match so local (asdf) and CI build the same
    toolchain. The governing pin for each module is the nearest ancestor
    .tool-versions with a golang line; modules without one are skipped. Nested
    modules (apps/<svc>/go.mod) are supported. Pass `--fix` via args to rewrite
    .tool-versions from go.mod instead of just reporting.
  entry: check-go-version-sync
  language: golang
  files: '(^|/)go\.mod$|(^|/)\.tool-versions$'
  pass_filenames: false

- id: check-license-headers
  name: check license headers (SPDX)
  description: |
    Fails when a source file does not carry an SPDX header. A repository's root
    LICENSE governs the repository but does not travel with a file copied out of
    it, which is exactly when attribution matters — so the per-file header is
    what keeps the notice attached to the work.

    Checks for `SPDX-License-Identifier:` and, unless `-copyright=false`, for
    `SPDX-FileCopyrightText:`. Pass `--license Apache-2.0` via args to require a
    specific identifier rather than any. Files whose head carries a
    `// Code generated ... DO NOT EDIT.` line are exempt. Pass `--fix` (with
    `--copyright-text`) to insert the header instead of failing.

    Defaults to Go files; override `types` or `files` for other languages and
    pass `--ext` to match when it walks a tree.
  entry: check-license-headers
  language: golang
  types: [go]

- id: check-conflict-markers
  name: check conflict markers
  description: |
    Fails when a file carries a version-control conflict marker.

    It differs from the usual check in two ways. It knows the `|||||||` base
    marker that the diff3 and zdiff3 conflict styles produce, which the
    three-marker checks miss. And it runs at every commit rather than only
    while a merge is in progress — a marker that was already committed is
    exactly the one a merge-only check can no longer reach.

    A row of equals signs is only reported when the file carries one of the
    other three markers, so a setext heading underline is not a conflict.
    Binary and oversized files are skipped; pass `--exclude` for a path that
    legitimately contains a marker, such as documentation about merging.
  entry: check-conflict-markers
  language: golang
